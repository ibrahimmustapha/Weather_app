<header class="relative z-10">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-4 px-6 py-6 text-slate-900 transition-colors duration-300 dark:text-slate-100">
    <div class="flex items-center gap-4">
      <div class="grid h-12 w-12 place-items-center rounded-3xl bg-gradient-to-br from-sky-400 via-cyan-400 to-indigo-500 text-lg font-semibold uppercase tracking-wide text-slate-950 shadow-lg shadow-sky-500/30 dark:shadow-sky-500/30">
        Wx
      </div>
      <div>
        <p class="text-lg font-semibold tracking-tight text-slate-900 transition-colors duration-300 dark:text-white">Aurora Weather</p>
        <p class="text-xs font-medium text-slate-500 transition-colors duration-300 sm:text-sm dark:text-slate-400">Stay ahead of shifting skies with real-time insights.</p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <div class="hidden items-center gap-3 text-xs text-slate-500 transition-colors duration-300 sm:flex dark:text-slate-300">
        <span class="rounded-full border border-slate-200/70 bg-white/80 px-3 py-1.5 tracking-wide backdrop-blur transition-colors duration-300 dark:border-white/15 dark:bg-white/5">Live Forecasts</span>
        <span class="rounded-full border border-slate-200/60 bg-white/75 px-3 py-1.5 tracking-wide backdrop-blur transition-colors duration-300 dark:border-white/10 dark:bg-white/5">Microclimate Ready</span>
      </div>
      <div class="flex items-center gap-2">
        <ng-container *ngIf="theme$ | async as theme">
          <button
            type="button"
            class="theme-toggle"
            (click)="toggleTheme()"
            [attr.aria-label]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
            [attr.aria-pressed]="theme === 'dark'"
          >
            <fa-icon [icon]="theme === 'dark' ? sunIcon : moonIcon"></fa-icon>
          </button>
        </ng-container>
        <a
          class="social-link flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200/70 bg-white text-xl text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:shadow-lg focus-visible:-translate-y-0.5 focus-visible:shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300/60 dark:border-white/15 dark:bg-white/5 dark:text-slate-200"
          href="https://github.com"
          aria-label="Visit GitHub profile"
          target="_blank"
          rel="noopener"
        >
          <fa-icon [icon]="githubIcon"></fa-icon>
        </a>
        <a
          class="social-link flex h-11 w-11 items-center justify-center rounded-2xl border border-slate-200/70 bg-white text-xl text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:shadow-lg focus-visible:-translate-y-0.5 focus-visible:shadow-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-300/60 dark:border-white/15 dark:bg-white/5 dark:text-slate-200"
          href="https://twitter.com"
          aria-label="Visit Twitter profile"
          target="_blank"
          rel="noopener"
        >
          <fa-icon [icon]="twitterIcon"></fa-icon>
        </a>
      </div>
    </div>
  </div>
</header>
